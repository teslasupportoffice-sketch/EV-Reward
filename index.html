<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesla Model 3 Giveaway</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a12;
      font-family: 'Arial', sans-serif;
      overflow-x: hidden;
    }

    .scene {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 1 / 1;
      background: 
        linear-gradient(to bottom, 
          rgba(10, 15, 40, 0.7) 0%, 
          rgba(10, 20, 50, 0.4) 40%, 
          rgba(5, 10, 25, 0.8) 100%),
        radial-gradient(ellipse at 50% 80%, #1a3a6e 0%, transparent 60%),
        linear-gradient(180deg, #0c1a3a 0%, #0a1528 50%, #050b18 100%);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(0, 100, 255, 0.15);
    }

    /* City skyline silhouette */
    .skyline {
      position: absolute;
      bottom: 28%;
      left: 0;
      width: 100%;
      height: 35%;
      background: 
        linear-gradient(to top, #0a1525 0%, transparent 100%);
      z-index: 1;
    }

    .skyline::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(90deg, transparent 0%, #0d1f3c 2%, transparent 4%),
        linear-gradient(90deg, transparent 8%, #122845 3%, transparent 12%),
        linear-gradient(90deg, transparent 15%, #0e2240 5%, transparent 22%),
        linear-gradient(90deg, transparent 25%, #152b4a 8%, transparent 35%),
        linear-gradient(90deg, transparent 38%, #0f2542 4%, transparent 45%),
        linear-gradient(90deg, transparent 50%, #183050 12%, transparent 65%),
        linear-gradient(90deg, transparent 68%, #112843 6%, transparent 78%),
        linear-gradient(90deg, transparent 82%, #142c48 9%, transparent 95%);
      background-size: 100% 100%;
      opacity: 0.9;
    }

    /* Glass building structure */
    .glass-building {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(90deg, 
          rgba(30, 50, 90, 0.15) 0%, 
          transparent 8%, 
          transparent 92%, 
          rgba(30, 50, 90, 0.15) 100%);
      border: 1px solid rgba(100, 150, 255, 0.1);
      z-index: 2;
    }

    /* Neon sign structure */
    .sign-wrapper {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
    }

    .enter-banner {
      display: inline-block;
      background: linear-gradient(180deg, #00c853, #00a844);
      color: white;
      font-weight: 800;
      font-size: clamp(14px, 2.5vw, 20px);
      letter-spacing: 3px;
      padding: 8px 28px;
      border-radius: 6px 6px 0 0;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
      box-shadow: 0 4px 15px rgba(0, 200, 80, 0.4);
    }

    .giveaway-box {
      position: relative;
      margin-top: -2px;
      background: rgba(10, 20, 40, 0.75);
      border: 2px solid rgba(180, 100, 255, 0.5);
      border-radius: 8px;
      padding: 18px 50px 25px;
      box-shadow: 
        0 0 20px rgba(180, 80, 255, 0.3),
        inset 0 0 30px rgba(100, 50, 200, 0.15);
      backdrop-filter: blur(8px);
    }

    .giveaway-text {
      font-size: clamp(36px, 8vw, 64px);
      font-weight: 900;
      letter-spacing: 4px;
      color: #d580ff;
      text-shadow:
        0 0 7px #d580ff,
        0 0 15px #c050ff,
        0 0 30px #a030ff,
        0 0 50px #8020ee,
        0 0 80px #6010cc;
      animation: neonPulse 2.5s ease-in-out infinite alternate;
    }

    @keyframes neonPulse {
      from { text-shadow: 0 0 7px #d580ff, 0 0 15px #c050ff, 0 0 30px #a030ff, 0 0 50px #8020ee; }
      to   { text-shadow: 0 0 10px #e0a0ff, 0 0 25px #d070ff, 0 0 45px #b050ff, 0 0 70px #9030ee, 0 0 100px #7020cc; }
    }

    /* Party poppers */
    .popper {
      position: absolute;
      top: 5%;
      width: 90px;
      height: 90px;
      z-index: 12;
    }

    .popper.left  { left: 6%;  transform: rotate(-25deg); }
    .popper.right { right: 6%; transform: rotate(25deg) scaleX(-1); }

    .popper-cone {
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 55px solid #f5c542;
      position: relative;
      filter: drop-shadow(0 0 8px rgba(255, 200, 50, 0.6));
    }

    .popper-cone::after {
      content: '';
      position: absolute;
      top: -55px;
      left: -12px;
      width: 24px;
      height: 18px;
      background: linear-gradient(135deg, #ff6b6b, #ff9f43);
      border-radius: 4px 4px 0 0;
    }

    /* Confetti streams */
    .confetti {
      position: absolute;
      top: -10px;
      width: 120px;
      height: 140px;
      pointer-events: none;
    }

    .confetti span {
      position: absolute;
      width: 6px;
      height: 14px;
      border-radius: 2px;
      animation: confettiFall 3s ease-in infinite;
    }

    .confetti span:nth-child(1) { background: #ff6b6b; left: 10%; animation-delay: 0s; }
    .confetti span:nth-child(2) { background: #ffd93d; left: 25%; animation-delay: 0.3s; width: 5px; }
    .confetti span:nth-child(3) { background: #6bcbff; left: 40%; animation-delay: 0.6s; }
    .confetti span:nth-child(4) { background: #c77dff; left: 55%; animation-delay: 0.2s; height: 10px; }
    .confetti span:nth-child(5) { background: #ff9f43; left: 70%; animation-delay: 0.8s; }
    .confetti span:nth-child(6) { background: #4ecdc4; left: 85%; animation-delay: 0.4s; width: 4px; }
    .confetti span:nth-child(7) { background: #ff6b9d; left: 15%; animation-delay: 1.1s; }
    .confetti span:nth-child(8) { background: #95e1d3; left: 60%; animation-delay: 0.7s; }

    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(120px) rotate(360deg); opacity: 0; }
    }

    /* Car platform */
    .platform {
      position: absolute;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: 78%;
      height: 12px;
      background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(100, 180, 255, 0.3) 15%, 
        rgba(150, 220, 255, 0.5) 50%, 
        rgba(100, 180, 255, 0.3) 85%, 
        transparent 100%);
      border-radius: 50%;
      box-shadow: 
        0 0 40px rgba(80, 180, 255, 0.5),
        0 0 80px rgba(50, 140, 255, 0.3),
        0 15px 30px rgba(0, 0, 0, 0.6);
      z-index: 5;
    }

    .platform::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 5%;
      width: 90%;
      height: 8px;
      background: linear-gradient(90deg, transparent, rgba(180, 230, 255, 0.4), transparent);
      border-radius: 50%;
    }

    /* Tesla car */
    .car {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      max-width: 520px;
      z-index: 6;
      filter: drop-shadow(0 20px 25px rgba(0, 0, 0, 0.5));
    }

    .car img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Fallback pure CSS car silhouette if no image */
    .car-fallback {
      display: none; /* set to block if you remove the img */
      width: 100%;
      height: 180px;
      background: linear-gradient(180deg, #f0f0f0 0%, #d8d8d8 100%);
      border-radius: 40% 40% 15% 15% / 60% 60% 20% 20%;
      position: relative;
    }

    /* Bottom banner */
    .bottom-banner {
      position: absolute;
      bottom: 4%;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 620px;
      background: linear-gradient(180deg, 
        rgba(20, 40, 70, 0.9) 0%, 
        rgba(10, 25, 50, 0.95) 100%);
      border: 2px solid rgba(100, 180, 255, 0.4);
      border-radius: 12px;
      padding: 16px 20px;
      text-align: center;
      box-shadow: 
        0 0 25px rgba(50, 150, 255, 0.25),
        inset 0 0 20px rgba(50, 100, 200, 0.1);
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .bottom-text {
      font-size: clamp(18px, 4vw, 28px);
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #ffe566 0%, #f0c020 50%, #d4a017 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      filter: drop-shadow(0 0 8px rgba(255, 200, 50, 0.4));
    }

    .icons {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .icon {
      width: 22px;
      height: 22px;
      border: 1.5px solid rgba(150, 200, 255, 0.6);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: rgba(180, 220, 255, 0.8);
    }

    /* Subtle floor reflection */
    .floor {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 22%;
      background: linear-gradient(to top, 
        rgba(5, 15, 35, 0.95) 0%, 
        rgba(10, 30, 60, 0.4) 60%, 
        transparent 100%);
      z-index: 4;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="skyline"></div>
    <div class="glass-building"></div>
    <div class="floor"></div>

    <!-- Party poppers -->
    <div class="popper left">
      <div class="confetti">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="popper-cone"></div>
    </div>
    <div class="popper right">
      <div class="confetti">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="popper-cone"></div>
    </div>

    <!-- Neon sign -->
    <div class="sign-wrapper">
      <div class="enter-banner">ENTER TO WIN</div>
      <div class="giveaway-box">
        <div class="giveaway-text">GIVEAWAY</div>
      </div>
    </div>

    <!-- Platform + Car -->
    <div class="platform"></div>
    <div class="car">
      <!-- Replace this src with a real white Tesla Model 3 PNG for best results -->
      <img src="IMG_1399.jpeg" 
           alt="White Tesla Model 3"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="car-fallback"></div>
    </div>

    <!-- Bottom banner -->
    <div class="bottom-banner">
      <div class="bottom-text">ENTER TO WIN A<br>TESLA MODEL 3</div>
      <div class="icons">
        <div class="icon">📷</div>
        <div class="icon">🔗</div>
        <div class="icon">💬</div>
      </div>
    </div>
  </div>
</body>
</html>
