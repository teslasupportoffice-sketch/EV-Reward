<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Model 3 Giveaway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030712;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 520px;
      max-height: 900px;
      background: 
        radial-gradient(circle at 50% 30%, rgba(147, 51, 234, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 50% 80%, rgba(59, 130, 246, 0.2) 0%, transparent 70%),
        linear-gradient(180deg, #070d1e 0%, #030712 100%);
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
    }

    /* Ambient Spotlight */
    .spotlight {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 0%, rgba(168, 85, 247, 0.25) 0%, rgba(59, 130, 246, 0.05) 50%, transparent 80%);
      pointer-events: none;
      z-index: 2;
    }

    /* Perspective Grid Floor */
    .grid-floor {
      position: absolute;
      bottom: 0;
      left: -50%;
      width: 200%;
      height: 45%;
      background-image: 
        linear-gradient(to right, rgba(59, 130, 246, 0.1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(59, 130, 246, 0.1) 1px, transparent 1px);
      background-size: 40px 30px;
      transform: perspective(300px) rotateX(60deg);
      mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 80%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 80%);
      z-index: 1;
    }

    /* Neon Header Sign */
    .sign-wrapper {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      width: 90%;
    }

    .enter-badge {
      display: inline-block;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(11px, 3vw, 14px);
      letter-spacing: 3px;
      padding: 6px 20px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      margin-bottom: -10px;
      position: relative;
      z-index: 2;
      text-transform: uppercase;
    }

    .giveaway-card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 16px;
      padding: 16px 24px 12px;
      box-shadow: 
        0 8px 32px 0 rgba(0, 0, 0, 0.37),
        0 0 20px rgba(168, 85, 247, 0.2),
        inset 0 0 15px rgba(168, 85, 247, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .giveaway-text {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(32px, 10vw, 48px);
      font-weight: 900;
      letter-spacing: 4px;
      color: #f472b6;
      text-shadow:
        0 0 10px rgba(244, 114, 182, 0.8),
        0 0 20px rgba(192, 132, 252, 0.6),
        0 0 40px rgba(168, 85, 247, 0.4);
      animation: neonGlow 2s ease-in-out infinite alternate;
    }

    @keyframes neonGlow {
      from { filter: drop-shadow(0 0 5px rgba(244, 114, 182, 0.6)); }
      to   { filter: drop-shadow(0 0 15px rgba(192, 132, 252, 0.9)); }
    }

    /* Confetti Burst Effect */
    .popper {
      position: absolute;
      top: 3%;
      width: 50px;
      height: 50px;
      z-index: 12;
      pointer-events: none;
    }
    .popper.left { left: 4%; transform: rotate(-15deg); }
    .popper.right { right: 4%; transform: rotate(15deg) scaleX(-1); }

    .confetti span {
      position: absolute;
      width: 6px;
      height: 10px;
      border-radius: 2px;
      animation: confettiFall 2.5s ease-in infinite;
    }

    .confetti span:nth-child(1) { background: #f43f5e; left: 10%; animation-delay: 0s; }
    .confetti span:nth-child(2) { background: #fbbf24; left: 30%; animation-delay: 0.4s; }
    .confetti span:nth-child(3) { background: #38bdf8; left: 50%; animation-delay: 0.2s; }
    .confetti span:nth-child(4) { background: #a855f7; left: 70%; animation-delay: 0.6s; }
    .confetti span:nth-child(5) { background: #34d399; left: 90%; animation-delay: 0.8s; }

    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(140px) rotate(360deg); opacity: 0; }
    }

    /* Center Stage Platform & Car */
    .platform-container {
      position: absolute;
      bottom: 24%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
    }

    .platform {
      width: 100%;
      height: 16px;
      background: radial-gradient(ellipse at center, rgba(56, 189, 248, 0.8) 0%, rgba(59, 130, 246, 0.2) 60%, transparent 80%);
      border-radius: 50%;
      box-shadow: 
        0 0 30px #38bdf8,
        0 10px 40px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .car {
      width: 90%;
      max-width: 440px;
      margin-bottom: -10px;
      filter: drop-shadow(0 15px 15px rgba(0, 0, 0, 0.7));
      animation: floatCar 4s ease-in-out infinite alternate;
    }

    @keyframes floatCar {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }

    .car img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Bottom Banner Box */
    .bottom-box {
      position: absolute;
      bottom: 4%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 460px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      padding: 18px 20px;
      text-align: center;
      box-shadow: 
        0 20px 25px -5px rgba(0, 0, 0, 0.5),
        0 0 25px rgba(56, 189, 248, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bottom-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(16px, 4.5vw, 22px);
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .bottom-title span {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* CTA Button pointing to info.html */
    .cta-button {
      display: block;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 900;
      letter-spacing: 1.5px;
      text-decoration: none;
      text-transform: uppercase;
      border-radius: 12px;
      box-shadow: 
        0 4px 15px rgba(220, 38, 38, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .cta-button:hover, .cta-button:active {
      transform: translateY(-2px);
      box-shadow: 
        0 6px 20px rgba(220, 38, 38, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
      background: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
    }

    .cta-button::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent,
        rgba(255, 255, 255, 0.2),
        transparent
      );
      transform: rotate(30deg);
      animation: shine 3s infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%) rotate(30deg); }
      20%, 100% { transform: translateX(100%) rotate(30deg); }
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="spotlight"></div>
    <div class="grid-floor"></div>

    <!-- Confetti Effects -->
    <div class="popper left">
      <div class="confetti">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
    <div class="popper right">
      <div class="confetti">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <!-- Top Neon Header -->
    <div class="sign-wrapper">
      <div class="enter-badge">ENTER TO WIN</div>
      <div class="giveaway-card">
        <div class="giveaway-text">GIVEAWAY</div>
      </div>
    </div>

    <!-- Center Stage Platform & Car -->
    <div class="platform-container">
      <div class="car">
        <img src="IMG_1399.jpeg" 
             alt="White Tesla Model 3"
             onerror="this.src='https://svgshare.com/i/13eE.svg'; this.style.opacity='0.8';">
      </div>
      <div class="platform"></div>
    </div>

    <!-- Bottom Interactive Banner with CTA Button -->
    <div class="bottom-box">
      <div class="bottom-title">
        WIN A BRAND NEW <br><span>TESLA MODEL 3</span>
      </div>
      
      <!-- Clickable Button linking to info.html -->
      <a href="information.html" class="cta-button">
        CLICK TO GET A TESLA MODEL 3
      </a>
    </div>
  </div>

</body>
</html>
