<!doctype html>
<html>
  <head>
    <title>EV Reward</title>
    <style>
      /* Card Container */
.card-container {
  max-width: 800px;
  margin: 2rem auto;
  background: #1a1a1a;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

/* Image Wrapper with Controlled Aspect Ratio */
.image-wrapper {
  width: 100%;
  aspect-ratio: 16 / 9;
  background-color: #2a2a2a;
  overflow: hidden;
  position: relative;
}

/* Responsive Image */
.responsive-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  transition: transform 0.3s ease;
}

.card-container:hover .responsive-img {
  transform: scale(1.03);
}

/* Card Text Section */
.card-content {
  padding: 1.5rem;
  color: #ffffff;
}

.card-content h2 {
  margin-top: 0;
  font-size: 1.5rem;
}

.card-content p {
  color: #aaaaaa;
  font-size: 0.95rem;
  line-height: 1.5;
  margin-bottom: 1.5rem;
}

/* Button Container & Styling */
.card-action {
  display: flex;
  justify-content: flex-start;
}

.action-btn {
  background-color: #0070f3;
  color: #ffffff;
  border: none;
  padding: 0.8rem 1.8rem;
  font-size: 1rem;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  transition: background-color 0.2s ease, transform 0.1s ease;
  width: 100%; /* Spans full width on mobile */
}

@media (min-width: 600px) {
  .action-btn {
    width: auto; /* Shrinks to text size on larger screens */
  }
}

.action-btn:hover {
  background-color: #0051a2;
}

.action-btn:active {
  transform: scale(0.98);
}
    </style>
  </head>
  <body>
<section class="card-container">
  <!-- Image Wrapper -->
  <div class="image-wrapper">
    <img src="IMG_1399.jpeg" alt="Featured Display" class="responsive-img">
  </div>

  <!-- Content & Button Section -->
  <div class="card-content">
    <h2>Project Title</h2>
    <p>This is a flexible container layout designed to handle any aspect ratio seamlessly.</p>
    
    <!-- Action Button -->
    <div class="card-action">
      <button type="button" class="action-btn" id="cardActionBtn">Learn More</button>
    </div>
  </div>
</section>
  </body>
  <footer>
    
  </footer>
</html>
